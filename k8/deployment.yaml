apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-k8s-deployment
  namespace: benjoo2421/my-k8s-app:qa
  annotations:
      circleci.com/project-id: f438b8a1-3296-461d-a06f-e6a000a648c3
  labels:
      circleci.com/component-name: my-k8s-app
      circleci.com/version: 1.0.0
      app: my-k8s-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-k8s-app
  template:
    metadata:
      labels:
        app: my-k8s-app
        circleci.com/component-name: my-k8s-app
        circleci.com/version: 1.0.0
    spec:
      containers:
      - name: my-container
        image: benjoo2421/my-k8s-app:qa
        ports:
        - containerPort: 3000